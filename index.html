<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My List</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/80e3c71521.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1 id="mainHeading">Task Manager for your all upcomming task</h1>
    </header>
    <div class="mainContainer">
        <aside class="SidePannel">
            <button onclick="AllTaskShow()"><i class="fa-solid fa-border-all"></i>All task</button>
            <button onclick="AllCompleteTask()"><i class="fa-solid fa-check-double"></i>complete</button>
            <button onclick="AllPandingTask()"><i class="fa-solid fa-hourglass"></i>panding</button>
            <button onclick="AllImportantTask()"><i class="fa-regular fa-star"></i>important</button>
            <button onclick="AllHistoryTask()"><i class="fa-solid fa-clock-rotate-left"></i>history</button>
        </aside>

        <div class="ListPannel">
            <div class="InputPannel">
                <input id="addItem" type="text" placeholder="add your task......">
                <button id="AddLogo" >+</button>
            </div>

            <div class="Listitem">
                <ol id="AllTaskHere" type="A"></ol>
            </div>

            <div class="CompleteItem">
                <ol id="AllCompleteTaskHere" type="A">c</ol>
            </div>

            <div class="PandingItem">
                <ol id="AllPandingTaskHere" type="A">P</ol>
            </div>
            
            <div class="ImportantItem">
                <ol id="AllImportantTaskHere" type="A">I</ol>
            </div>

            <div class="HistoryItem">
                <ol id="AllHistoryTaskHere" type="A">H</ol>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
